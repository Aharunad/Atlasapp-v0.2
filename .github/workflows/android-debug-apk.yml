name: Build ATLAS Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ATLAS_Futurica_v0.2_Source.zip'
      - '.github/workflows/build-atlas-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ATLAS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ATLAS_Futurica_v0.2_Source.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE is missing or empty."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -oq ATLAS_Futurica_v0.2_Source.zip -d extracted

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file was found."
            echo "The ZIP may not contain a complete Android project."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Build finished without a debug APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/ATLAS-Futurica-debug.apk"

          echo "APK collected successfully."
          sha256sum "$GITHUB_WORKSPACE/apk-output/ATLAS-Futurica-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Futurica-debug-APK
          path: apk-output/ATLAS-Futurica-debug.apk
          if-no-files-found: error
          retention-days: 14
