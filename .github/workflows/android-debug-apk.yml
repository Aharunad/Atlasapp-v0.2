name: Build ATLAS Futurica v0.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ATLAS_Futurica_v0.2_Source.zip'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v0.2 source
        run: |
          set -euo pipefail
          test -s ATLAS_Futurica_v0.2_Source.zip
          mkdir -p _atlas_source
          unzip -q ATLAS_Futurica_v0.2_Source.zip -d _atlas_source
          test -f _atlas_source/ATLAS_Futurica_Android_Project/settings.gradle
          echo "ATLAS source extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: _atlas_source/ATLAS_Futurica_Android_Project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="_atlas_source/ATLAS_Futurica_Android_Project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Futurica-v0.2-debug-APK
          path: _atlas_source/ATLAS_Futurica_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
